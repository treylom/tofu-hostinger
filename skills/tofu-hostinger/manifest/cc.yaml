route: cc
steps:
  - id: c1
    title: Claude Code CLI 설치(전제 조건)
    action: |
      Claude Code CLI 가 설치돼 있는지 확인한다(미설치면 https://claude.ai/code 안내로 먼저 설치). 인증 실행은 다음 c2 에서 한다. ThisCode 설치는 이 CLI 가 이미 설치돼 있다는 것을 전제로 하며, install.sh 내부의 install-superpowers.sh 단계가 claude CLI 를 직접 호출한다.
    observation: |
      UI 확인: https://claude.ai/code 안내에 따라 설치가 끝났는지 확인(README 에 별도 CLI 확인 명령은 없음)
    expected: |
      "Claude Code CLI already installed + authenticated" — README 가 명시하는 전제 상태.
    mismatch: |
      README 에 별도 mismatch 안내 없음. 미설치 상태면 https://claude.ai/code 설치 절차를 완료한 뒤 재시도.
    verified: pending
    source: ThisCode README "🛠️ Zero-config Install" Prerequisite

  - id: c2
    title: Claude Code 인증
    action: |
      claude auth login
    observation: |
      (셸에서) claude auth status
    expected: |
      `loggedIn: true` / `authMethod: claude.ai`. 서버엔 브라우저가 없으므로 터미널의 URL 을 복사해 «내 컴퓨터» 브라우저에서 열고, 화면의 코드를 터미널 Paste code 프롬프트에 붙여넣는 흐름이다(help.md 인증 절과 동일).
    mismatch: |
      🔴 화면 글자로 판정하지 말 것 — `Invalid code.` 가 떴다가 곧바로 `Login successful.` 이 이어지는 경우가 있다(실측). 판정은 `claude auth status` 결과로만. 코드가 길어 일부만 복사되면 나는 에러 — 전체를 다시 복사해 붙여넣기.
    verified: measured
    source: 2026-08-20 라이브 VPS 실측(help.md 인증 절과 동일 근거) · ThisCode README "🚀 Quick Start" Step 2

  - id: c3
    title: (선택) ThisCode 번들 설치
    action: |
      git clone https://github.com/treylom/ThisCode ~/.claude/plugins/thiscode
      cd ~/.claude/plugins/thiscode
      bash scripts/install.sh --apply
    observation: |
      설치 로그에서 5개 항목 설치 확인 후: bash scripts/healthcheck.sh
    expected: |
      README "This single command installs:" 목록대로 5개 설치 — ① superpowers 플러그인(Claude Code 플러그인 매니저 경유) ② ripgrep(brew/apt/dnf/apk 다중 패키지매니저 폴백) ③ Obsidian CLI 감지(Tier 3 — 없으면 수동 다운로드 안내) ④ GraphRAG core(Tier 1 — vendored Python 런타임 + 7개 pip 패키지) ⑤ Dense embedding(선택 4채널, 사용자 1회 확인 · 약 1GB). healthcheck.sh = 6단계 검증(superpowers + ripgrep + obsidian-cli + vault-search MCP + GraphRAG + Dense embedding).
    mismatch: |
      README "⚠️ Troubleshooting" 섹션 기준: nvm: command not found → 터미널을 완전히 닫고 새로 연다(source ~/.bashrc 가 모든 셸에서 동작하지 않을 수 있음). install.sh permission denied → chmod +x install.sh 후 ./install.sh, 또는 bash install.sh 로 실행. GraphRAG 서버가 안 뜨면 → bash scripts/install-graphrag.sh --check(python3+vendor SoT+requirements+venv+서버 health) / --preflight(Python 3.10+/디스크 5GB+/포트 8400/vendor SoT) / --apply(venv 설치+pip install+nohup uvicorn) 순서로 확인.
    verified: pending
    source: ThisCode README "🛠️ Zero-config Install" + "⚠️ Troubleshooting"
